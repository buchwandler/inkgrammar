[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptstrokes"
description = "Open writing models, pen trajectories, scan extraction, and quality control for handwriting systems."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Holger Nahrstaedt"}]
dynamic = ["version"]
keywords = [
  "handwriting",
  "cursive",
  "strokes",
  "pen-trajectory",
  "writing-model",
  "font",
  "education",
]
dependencies = [
  "fonttools>=4.55",
  "numpy>=1.24",
  "packaging>=24",
  "Pillow>=10",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Fonts",
]

[project.urls]
Homepage = "https://github.com/buchwandler/scriptstrokes"
Repository = "https://github.com/buchwandler/scriptstrokes"
Issues = "https://github.com/buchwandler/scriptstrokes/issues"
Changelog = "https://github.com/buchwandler/scriptstrokes/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
scriptstrokes = "scriptstrokes.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["scriptstrokes*"]

[tool.setuptools_scm]
write_to = "scriptstrokes/_version.py"
fallback_version = "0.1.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

pythonpath = ["."]
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
