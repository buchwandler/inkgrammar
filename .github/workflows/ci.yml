name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: External geometry contracts
        run: |
          python -W error::DeprecationWarning -m pytest \
            tests/test_fit_skeleton_graph.py \
            tests/test_fit_family_v4.py \
            tests/test_outline.py \
            tests/test_planarcurve_adapters.py \
            tests/test_external_geometry_pipeline.py \
            tests/test_trajectory_topology_evidence.py

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

      - name: Validate demo model
        run: inkgrammar model validate data/models/demo-looped.yaml --strict

      - name: Build data release fixture
        run: inkgrammar build-release data/models/demo-looped.yaml --version ci --output dist
