name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" build

      - name: Validate
        run: |
          ruff check .
          pytest
          scriptstrokes model validate data/models/sas-1968.yaml --strict
          scriptstrokes model coverage data/models/sas-1968.yaml --fail-incomplete
          python -c 'from scriptstrokes.io import load_model; m = load_model("data/models/sas-1968.yaml"); assert m.license != "REPLACE-AFTER-RIGHTS-REVIEW", "SAS model-data rights review is required before publication"'

      - name: Build Python distributions
        run: python -m build

      - name: Build data release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scriptstrokes build-release data/models/sas-1968.yaml \
            --version "$VERSION" --output dist-data

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist-data/*.zip
            dist-data/*.zip.sha256
          generate_release_notes: true
