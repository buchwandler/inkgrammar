# Layout for the supplied SAS-1968 numbered connection-examples page
# (source: sas-1968-connections-numbered, 273x223 px).
#
# Each example is kept intact as a connection-pair observation (the brief's
# section 20: the pair image itself is the evidence; do not cut pairs into
# independent glyphs first). The source numbers group the examples ("2.",
# "3." at the left margin) and are used in the stable observation IDs.
# Small arrow marks below the group-3 pairs are printed annotation marks and
# are excluded from the pair regions. The group numbering may correspond to
# the numbered categories on the connection-categories page; that mapping is a
# reviewed step and is left pending here.
