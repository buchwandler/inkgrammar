# Layout for the supplied SAS-1968 connection-categories page
# (source: sas-1968-connection-categories, 538x544 px).
#
# Each numbered heading is a first-class connection-category entity (the
# brief's sections 21 and 94). The exact German source terminology is kept in
# `label`; English internal identifiers live in the region ids. Member labels
# are the example pairs as written on the page. Mapping source categories to
# runtime connection classes is a separate reviewed step and is not done here
# (section 65). The page number "30" at the bottom is page furniture and is
# not an observation.
schema_version: 1
id: sas-1968-connection-categories
description: >
  Connection categories with source-language headings and declared member
  example pairs.
