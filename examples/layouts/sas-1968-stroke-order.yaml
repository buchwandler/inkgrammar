# Layout for the supplied SAS-1968 stroke-order and special-forms page
# (source: sas-1968-stroke-order, 541x285 px).
#
# Two kinds of data per the brief's section 19:
#   1. numbered stroke-order demonstrations (kind: stroke-order-demonstration)
#      with the printed numbers/arrows kept out of the target ink region;
#   2. special-form glyph observations (kind: glyph-isolated).
#
# `sequence` lists the declared stroke numbers visible on the page. Where the
# source numbering unambiguously gives the order, the stroke evidence is
# source-explicit (recorded in review notes; annotation evidence is set when
# stroke annotations are created). The printed caption at the bottom
# ("Grundsätzlich kann festgestellt werden:") is page furniture and is not an
# observation. Labels were transcribed visually and require human review.
