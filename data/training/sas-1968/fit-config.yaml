format: inkgrammar-fit-config
format_version: 1
objective:
  version: 3
  assignment:
    sigma_px: 4.0
    min_target_probability: 0.55
    outlier_mass: 0.15
    recompute_each_cycle: true
  centerline:
    method: skeletonize
    sample_schedule: [24, 48, 96]
    min_spur_length_px: 3.0
    min_confidence: 0.25
  geometry:
    position_sigma_px: 1.5
    coverage_sigma_px: 1.5
    endpoint_sigma_px: 1.0
    tangent_sigma_rad: 0.20
    radius_sigma_px: 1.5
    candidate_to_target: 1.0
    target_to_candidate: 1.0
    endpoint: 0.8
    tangent: 0.3
    radius: 0.1
    coverage_tolerance_px: 2.0
  priors:
    transform: 0.15
    shape: 0.03
    curvature: 0.01
  family:
    worst: 0.20
    spread: 0.05
optimizer:
  method: centerline-em-trf
  seed: 1968
  loss: soft_l1
  f_scale: 1.0
  max_nfev: 120
  max_cycles: 4
  convergence_relative: 0.0005
  restarts: 2
render:
  stroke_width_px: 3.0
  supersampling: 4
split_policy:
  fit: "used by numerical optimization"
  validation: "may select settings or stopping decisions"
  hold-out: "report only, never used for selection during the same run"
