format: inkgrammar-fit-config
format_version: 1
objective:
  version: 4
  curve:
    basis: cubic-bspline
    parameterization: normalized-arclength
    default_control_points: 6
    smoothness_lambda: 0.02
    seed_lambda: 0.01
    robust_loss: huber
    robust_scale_px: 1.5
    adaptive_knots: false
  correspondence:
    method: monotone-arclength
    position_sigma_px: 2.0
    tangent_sigma_rad: 0.35
    tangent_weight: 0.2
    warp_weight: 0.10
    gap_penalty: 0.20
  assignment:
    sigma_px: 4.0
    min_target_probability: 0.55
    outlier_mass: 0.15
    recompute_each_cycle: true
  centerline:
    method: skeletonize
    sample_schedule: [32, 64, 128]
    min_spur_length_px: 3.0
    min_confidence: 0.25
  geometry:
    radius: 0.0
  priors:
    curvature: 0.0
  family:
    worst: 0.20
    spread: 0.05
optimizer:
  method: spline-annealed-alt-lsq
  seed: 1968
  anneal_steps: 240
  anneal_initial_samples: 32
  anneal_target_uphill_acceptance: 0.80
  anneal_cooling: 0.975
  anneal_sigma_max: 0.30
  anneal_sigma_min: 0.025
  anneal_reheat_patience: 40
  anneal_restart_patience: 100
  anneal_top_k: 4
  anneal_coarse_cycles: 2
  anneal_medium_cycles: 4
  anneal_final_cycles: 10
  transform_max_nfev: 120
  irls_iterations: 3
  convergence_relative: 0.0005
render:
  stroke_width_px: 3.0
  supersampling: 4
split_policy:
  fit: "used by numerical optimization"
  validation: "may select settings or stopping decisions"
  hold-out: "report only, never used for selection during the same run"
