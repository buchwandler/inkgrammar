format: inkgrammar-fit-config
format_version: 1
skeletonpaths:
  search_limits:
    max_paths: 10000
    max_states: 100000
  ranking_policy:
    guide_samples: 64
    turning_samples: 64
    guide_tie_tolerance_px: 1.0e-9
    ambiguity_guide_distance_px: 0.5
    ambiguity_endpoint_order_px: 0.5
    ambiguity_confidence: 0.05
    ambiguity_length_error_px: 1.0
    ambiguity_turning_cost: 0.1
    turning_cost_is_evidence: false
objective:
  version: 4
  curve:
    basis: cubic-bspline
    parameterization: normalized-arclength
    default_control_points: 6
    smoothness_lambda: 0.02
    seed_lambda: 0.01
    robust_loss: huber
    robust_scale_px: 1.5
    adaptive_knots: false
  correspondence:
    method: monotone-arclength
    position_sigma_px: 2.0
    tangent_sigma_rad: 0.35
    tangent_weight: 0.2
    warp_weight: 0.1
    gap_penalty: 0.2
  assignment:
    sigma_px: 4.0
    min_target_probability: 0.55
    outlier_mass: 0.15
    recompute_each_cycle: true
  centerline:
    method: skeletonize
    sample_schedule: [32, 64, 128]
    min_spur_length_px: 3.0
    min_confidence: 0.25
  geometry:
    radius: 0.0
  priors:
    curvature: 0.0
  family:
    worst: 0.2
    spread: 0.05
optimizer:
  method: spline-alt-lsq
  seed: 1968
  max_cycles: 2
  transform_max_nfev: 20
  irls_iterations: 1
  assignment_update_interval: 1
  convergence_relative: 0.0005
render:
  stroke_width_px: 3.0
  supersampling: 4
split_policy:
  fit: used by numerical optimization
  validation: diagnostic only, no candidate selection
  hold-out: report only, never used for selection during the same run
